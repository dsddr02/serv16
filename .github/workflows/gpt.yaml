name: Compile the kernel gpt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq"
        type: choice
        options:
          - unifreq
          - codesnas
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 5.4.y
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 5.4.y_5.10.y
          - 5.15.y_6.1.y
          - 6.18.y_6.12.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - clang
          - gcc
          - gcc-11.3
          - gcc-12.2
          - gcc-12.3
          - gcc-13.2
          - gcc-13.3
      compress_format:
        description: "Set the initrd compression format"
        required: false
        default: "xz"
        type: choice
        options:
          - xz
          - gzip
          - zstd
          - lzma
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-ophub"
        type: choice
        options:
          - -ophub
          - -yourname

env:
  TZ: America/New_York
  ACTIONS_STEP_DEBUG: false  # 禁用详细的调试输出

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 限制克隆深度，减少不必要的日志

      - name: Initialization environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理 Docker 镜像
          docker rmi $(docker images -q) 2>/dev/null || true
          
          # 清理不必要的内容
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null || true
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          
          # 更新系统并安装必要的构建工具
          sudo -E apt-get -y update
          sudo -E apt-get -y upgrade
          
          # 清理不需要的软件包（使用更安全的命令）
          sudo -E apt-get -y purge azure-cli firefox google-chrome-stable || true
          
          # 安装编译内核所需的基本依赖（分组安装，便于调试）
          echo "安装基础编译工具..."
          sudo -E apt-get -y install \
            build-essential \
            crossbuild-essential-arm64 \
            libncurses-dev \
            libssl-dev \
            bc \
            flex \
            bison \
            kmod \
            cpio || true
          
          echo "安装交叉编译工具链..."
          sudo -E apt-get -y install \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-11-aarch64-linux-gnu \
            gcc-12-aarch64-linux-gnu \
            gcc-13-aarch64-linux-gnu \
            libelf-dev \
            lz4 \
            lzop \
            dwarves || true
          
          echo "安装设备树和U-Boot工具..."
          sudo -E apt-get -y install \
            device-tree-compiler \
            u-boot-tools \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            ccache \
            git \
            wget \
            curl \
            xz-utils \
            file \
            rsync \
            python3 \
            python3-pip \
            pigz \
            pbzip2 \
            pixz \
            pv || true
          
          # 安装可选工具（如果存在）
          echo "安装可选工具..."
          sudo -E apt-get -y install \
            clang \
            lld \
            llvm \
            libfuse-dev \
            libusb-1.0-0-dev \
            libbison-dev \
            libmpc-dev \
            libcrypto++-dev \
            libfdt-dev \
            mtools \
            f2fs-tools \
            nfs-kernel-server \
            ntpdate \
            patchutils \
            rdfind \
            rename \
            uuid \
            uuid-dev \
            xsltproc \
            imagemagick \
            aptly \
            axel \
            distcc \
            expect || true
          
          # 清理系统
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          
          # 清理用户配置
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          
          # 设置时区
          sudo timedatectl set-timezone "${TZ}"
          
          # 验证安装
          echo "验证工具安装:"
          which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1
          which arm-linux-gnueabi-gcc && arm-linux-gnueabi-gcc --version | head -1
          which dtc && dtc --version
          which bc && bc --version | head -1
          which flex && flex --version
          which bison && bison --version
          
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create simulated physical disk
        id: disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner.runner /builder
          df -Th

      - name: Create a mapped directory
        id: mapped
        working-directory: /builder
        run: |
          df -hT ${PWD}
          mkdir -p /builder/{kernel,output}
          ln -sf /builder/kernel /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/compile-kernel/kernel
          ln -sf /builder/output /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/compile-kernel/output
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile the kernel [ ${{ inputs.kernel_version }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.mapped.outputs.status }} == 'success' && !cancelled()
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          kernel_sign: ${{ inputs.kernel_sign }}
          compress_format: ${{ inputs.compress_format }}

      - name: Upload Kernel to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUSS }} == 'success' && !cancelled()
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            The kernel can be used to compile Armbian and OpenWrt.
            The kernel source code comes from: ${{ inputs.kernel_source }}
            The kernel compilation toolchain: ${{ inputs.kernel_toolchain }}
